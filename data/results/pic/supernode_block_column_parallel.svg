<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      .label { font-family: "Times New Roman", "SimSun", serif; font-size: 24px; fill: #222222; }
      .small { font-family: "Times New Roman", "SimSun", serif; font-size: 19px; fill: #222222; }
      .tiny { font-family: "Times New Roman", "SimSun", serif; font-size: 16px; fill: #222222; }
      .mono { font-family: "Courier New", monospace; font-size: 18px; fill: #222222; }
      .grid { stroke: #555555; stroke-width: 1.4; }
      .thin { stroke: #8A8A8A; stroke-width: 1.2; fill: none; }
      .arrow { stroke: #333333; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #666666; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
      .brace { stroke: #333333; stroke-width: 2.2; fill: none; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- packed dense panel -->
  <g transform="translate(90,86)">
    <text x="150" y="-28" text-anchor="middle" class="label">S<tspan baseline-shift="sub" font-size="15">k</tspan></text>
    <text x="-36" y="70" text-anchor="middle" class="tiny" transform="rotate(-90 -36 70)">内部行</text>
    <text x="-36" y="270" text-anchor="middle" class="tiny" transform="rotate(-90 -36 270)">更新行</text>

    <!-- column labels -->
    <g class="mono">
      <text x="32" y="-8" text-anchor="middle">j0</text>
      <text x="96" y="-8" text-anchor="middle">j1</text>
      <text x="160" y="-8" text-anchor="middle">j2</text>
      <text x="224" y="-8" text-anchor="middle">j3</text>
    </g>

    <!-- panel cells, nscol=4, nsrow=7 -->
    <g>
      <!-- row 0 -->
      <rect x="0" y="0" width="64" height="48" fill="#B3C6E5" class="grid"/>
      <rect x="64" y="0" width="64" height="48" fill="#FFFFFF" class="grid"/>
      <rect x="128" y="0" width="64" height="48" fill="#FFFFFF" class="grid"/>
      <rect x="192" y="0" width="64" height="48" fill="#FFFFFF" class="grid"/>
      <!-- row 1 -->
      <rect x="0" y="48" width="64" height="48" fill="#B3C6E5" class="grid"/>
      <rect x="64" y="48" width="64" height="48" fill="#F6C8AA" class="grid"/>
      <rect x="128" y="48" width="64" height="48" fill="#FFFFFF" class="grid"/>
      <rect x="192" y="48" width="64" height="48" fill="#FFFFFF" class="grid"/>
      <!-- row 2 -->
      <rect x="0" y="96" width="64" height="48" fill="#B3C6E5" class="grid"/>
      <rect x="64" y="96" width="64" height="48" fill="#F6C8AA" class="grid"/>
      <rect x="128" y="96" width="64" height="48" fill="#B8DDB2" class="grid"/>
      <rect x="192" y="96" width="64" height="48" fill="#FFFFFF" class="grid"/>
      <!-- row 3 -->
      <rect x="0" y="144" width="64" height="48" fill="#B3C6E5" class="grid"/>
      <rect x="64" y="144" width="64" height="48" fill="#F6C8AA" class="grid"/>
      <rect x="128" y="144" width="64" height="48" fill="#B8DDB2" class="grid"/>
      <rect x="192" y="144" width="64" height="48" fill="#D8E8D4" class="grid"/>
      <!-- update rows -->
      <rect x="0" y="192" width="64" height="48" fill="#E2ECFA" class="grid"/>
      <rect x="64" y="192" width="64" height="48" fill="#FBE3D3" class="grid"/>
      <rect x="128" y="192" width="64" height="48" fill="#D8E8D4" class="grid"/>
      <rect x="192" y="192" width="64" height="48" fill="#FFFFFF" class="grid"/>

      <rect x="0" y="240" width="64" height="48" fill="#E2ECFA" class="grid"/>
      <rect x="64" y="240" width="64" height="48" fill="#FFFFFF" class="grid"/>
      <rect x="128" y="240" width="64" height="48" fill="#D8E8D4" class="grid"/>
      <rect x="192" y="240" width="64" height="48" fill="#D8E8D4" class="grid"/>

      <rect x="0" y="288" width="64" height="48" fill="#FFFFFF" class="grid"/>
      <rect x="64" y="288" width="64" height="48" fill="#FBE3D3" class="grid"/>
      <rect x="128" y="288" width="64" height="48" fill="#D8E8D4" class="grid"/>
      <rect x="192" y="288" width="64" height="48" fill="#D8E8D4" class="grid"/>
    </g>

    <line x1="-10" y1="192" x2="266" y2="192" class="dash"/>
    <text x="128" y="370" text-anchor="middle" class="small">dense panel</text>
  </g>

  <!-- column-major packed values -->
  <g transform="translate(420,126)">
    <text x="190" y="-26" text-anchor="middle" class="label">packed_values</text>
    <path d="M -55 142 C -18 142 -12 142 24 142" class="arrow"/>

    <g>
      <rect x="0" y="0" width="76" height="44" fill="#B3C6E5" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="44" width="76" height="44" fill="#B3C6E5" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="88" width="76" height="44" fill="#B3C6E5" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="132" width="76" height="44" fill="#B3C6E5" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="176" width="76" height="44" fill="#E2ECFA" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="220" width="76" height="44" fill="#E2ECFA" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="264" width="76" height="44" fill="#FFFFFF" stroke="#555555" stroke-width="1.3"/>
      <text x="38" y="330" text-anchor="middle" class="mono">j0</text>
    </g>
    <g transform="translate(82,0)">
      <rect x="0" y="0" width="76" height="44" fill="#FFFFFF" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="44" width="76" height="44" fill="#F6C8AA" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="88" width="76" height="44" fill="#F6C8AA" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="132" width="76" height="44" fill="#F6C8AA" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="176" width="76" height="44" fill="#FBE3D3" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="220" width="76" height="44" fill="#FFFFFF" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="264" width="76" height="44" fill="#FBE3D3" stroke="#555555" stroke-width="1.3"/>
      <text x="38" y="330" text-anchor="middle" class="mono">j1</text>
    </g>
    <g transform="translate(164,0)">
      <rect x="0" y="0" width="76" height="44" fill="#FFFFFF" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="44" width="76" height="44" fill="#FFFFFF" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="88" width="76" height="44" fill="#B8DDB2" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="132" width="76" height="44" fill="#B8DDB2" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="176" width="76" height="44" fill="#D8E8D4" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="220" width="76" height="44" fill="#D8E8D4" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="264" width="76" height="44" fill="#D8E8D4" stroke="#555555" stroke-width="1.3"/>
      <text x="38" y="330" text-anchor="middle" class="mono">j2</text>
    </g>
    <g transform="translate(246,0)">
      <rect x="0" y="0" width="76" height="44" fill="#FFFFFF" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="44" width="76" height="44" fill="#FFFFFF" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="88" width="76" height="44" fill="#FFFFFF" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="132" width="76" height="44" fill="#D8E8D4" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="176" width="76" height="44" fill="#FFFFFF" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="220" width="76" height="44" fill="#D8E8D4" stroke="#555555" stroke-width="1.3"/>
      <rect x="0" y="264" width="76" height="44" fill="#D8E8D4" stroke="#555555" stroke-width="1.3"/>
      <text x="38" y="330" text-anchor="middle" class="mono">j3</text>
    </g>
  </g>

  <!-- CUDA block -->
  <g transform="translate(830,96)">
    <text x="145" y="-24" text-anchor="middle" class="label">CUDA block</text>
    <text x="145" y="2" text-anchor="middle" class="small">32线程</text>

    <!-- thread strip -->
    <rect x="0" y="36" width="290" height="58" rx="8" fill="#FFFFFF" stroke="#555555" stroke-width="1.6"/>
    <rect x="12" y="48" width="44" height="34" rx="3" fill="#B3C6E5" stroke="#555555"/>
    <rect x="64" y="48" width="44" height="34" rx="3" fill="#F6C8AA" stroke="#555555"/>
    <rect x="116" y="48" width="44" height="34" rx="3" fill="#B8DDB2" stroke="#555555"/>
    <rect x="168" y="48" width="44" height="34" rx="3" fill="#D8E8D4" stroke="#555555"/>
    <rect x="220" y="48" width="58" height="34" rx="3" fill="#FFFFFF" stroke="#555555"/>
    <g class="mono">
      <text x="34" y="71" text-anchor="middle">t0</text>
      <text x="86" y="71" text-anchor="middle">t1</text>
      <text x="138" y="71" text-anchor="middle">t2</text>
      <text x="190" y="71" text-anchor="middle">t3</text>
      <text x="249" y="71" text-anchor="middle">...</text>
    </g>

    <!-- internal solve -->
    <path d="M 34 96 L 34 150" class="arrow"/>
    <rect x="-20" y="160" width="108" height="58" rx="8" fill="#B3C6E5" stroke="#555555" stroke-width="1.4"/>
    <text x="34" y="196" text-anchor="middle" class="small">内部求解</text>

    <!-- parallel update rows -->
    <path d="M 146 96 L 146 150" class="arrow"/>
    <rect x="102" y="160" width="158" height="58" rx="8" fill="#B8DDB2" stroke="#555555" stroke-width="1.4"/>
    <text x="181" y="196" text-anchor="middle" class="small">并行更新行</text>

    <!-- shared reduction / writeback idea -->
    <path d="M 181 220 L 181 282" class="arrow"/>
    <rect x="88" y="292" width="186" height="54" rx="8" fill="#F6C8AA" stroke="#555555" stroke-width="1.4"/>
    <text x="181" y="326" text-anchor="middle" class="mono">atomicAdd(work)</text>

    <!-- x output -->
    <path d="M 34 220 C 34 382 108 382 148 354" class="arrow"/>
    <rect x="108" y="386" width="146" height="54" rx="8" fill="#E2ECFA" stroke="#555555" stroke-width="1.4"/>
    <text x="181" y="421" text-anchor="middle" class="mono">x[c0:c1)</text>
  </g>

  <!-- Main data flow -->
  <path d="M 742 278 C 780 278 792 278 822 278" class="arrow"/>

  <!-- work vector -->
  <g transform="translate(505,560)">
    <text x="150" y="-18" text-anchor="middle" class="label">work</text>
    <rect x="0" y="0" width="64" height="44" fill="#FFFFFF" stroke="#555555" stroke-width="1.3"/>
    <rect x="64" y="0" width="64" height="44" fill="#B3C6E5" stroke="#555555" stroke-width="1.3"/>
    <rect x="128" y="0" width="64" height="44" fill="#F6C8AA" stroke="#555555" stroke-width="1.3"/>
    <rect x="192" y="0" width="64" height="44" fill="#B8DDB2" stroke="#555555" stroke-width="1.3"/>
    <rect x="256" y="0" width="64" height="44" fill="#D8E8D4" stroke="#555555" stroke-width="1.3"/>
    <g class="mono">
      <text x="32" y="29" text-anchor="middle">...</text>
      <text x="96" y="29" text-anchor="middle">r4</text>
      <text x="160" y="29" text-anchor="middle">r5</text>
      <text x="224" y="29" text-anchor="middle">r6</text>
      <text x="288" y="29" text-anchor="middle">...</text>
    </g>
  </g>

  <path d="M 1010 445 C 980 535 878 582 830 582" class="arrow"/>
</svg>
