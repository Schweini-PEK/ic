<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IC-PCG SpTRSV 展示系统</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">GPU IC-PCG</p>
          <h1>融合低精度计算与超节点调度的 SpTRSV 展示系统</h1>
        </div>
        <div class="status-pill" id="serverStatus">后端检测中</div>
      </header>

      <section class="control-panel">
        <div class="field">
          <label for="routeSelect">SpTRSV 路线</label>
          <select id="routeSelect"></select>
        </div>
        <div class="field">
          <label for="precisionSelect">计算精度</label>
          <select id="precisionSelect"></select>
        </div>
        <div class="fixed-options">
          <span>重排序：<strong id="fixedOrdering">RCM</strong></span>
          <span>预缩放：<strong id="fixedScaling">UnitSqrtDiag</strong></span>
          <span>矩阵：<strong>全部 7 个</strong></span>
        </div>
        <button class="primary-button" id="runButton">一键运行全部矩阵</button>
      </section>

      <section class="summary-grid">
        <article class="metric-card">
          <span>当前路线</span>
          <strong id="routeMetric">-</strong>
        </article>
        <article class="metric-card">
          <span>当前精度</span>
          <strong id="precisionMetric">-</strong>
        </article>
        <article class="metric-card">
          <span>运行状态</span>
          <strong id="runStatus">未运行</strong>
        </article>
      </section>

      <section class="content-grid">
        <article class="panel">
          <div class="panel-header">
            <h2>测试矩阵</h2>
          </div>
          <table>
            <thead>
              <tr>
                <th>编号</th>
                <th>名称</th>
                <th>阶数</th>
                <th>非零元数</th>
              </tr>
            </thead>
            <tbody id="matrixTable"></tbody>
          </table>
        </article>

        <article class="panel">
          <div class="panel-header">
            <h2>运行日志</h2>
          </div>
          <pre id="logOutput">等待创建实验任务。</pre>
        </article>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>实验结果预览</h2>
          <span id="runIdLabel">尚未生成 run_id</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>编号</th>
              <th>矩阵</th>
              <th>状态</th>
              <th>PCG迭代次数</th>
              <th>SpTRSV平均时间/ms</th>
              <th>PCG总时间/ms</th>
              <th>最终相对残差</th>
            </tr>
          </thead>
          <tbody id="resultTable"></tbody>
        </table>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
